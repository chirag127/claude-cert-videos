<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Claude Code, MCP &amp; Integration — flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#f1f5f9}
.wrap{max-width:760px;margin:40px auto;padding:0 20px}
h1{font-size:24px;margin:0 0 16px}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#334155}
.card{perspective:1200px;height:280px;margin-bottom:18px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#1e293b;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;line-height:1.4;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#0b1224;border-color:#475569}
.meta{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;justify-content:space-between}
.front-term{font-weight:600;font-size:26px}
.defn{white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <h1>Claude Code, MCP &amp; Integration — flashcards</h1>
  <div class="toolbar">
    <button id="prev">◀ Prev (←)</button>
    <button id="flip">Flip (Space)</button>
    <button id="next">Next (→)</button>
    <button id="shuffle">Shuffle</button>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
  </div>
  <div class="meta"><span id="pos">1 / 7</span><span id="hint">click card or press Space to flip</span></div>
  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front"><span class="front-term" id="front"></span></div>
      <div class="face back"><span class="defn" id="back"></span></div>
    </div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Cards: 7 · Click any card to flip · Use ← / → to navigate</p>
</div>
<script>
const CARDS = [["A short self-check","If the rule feels too abstract, the smallest defensible move involves retries, not auth model.

More:
- When in doubt, the key question is which move involving auth model comes first?
- Once you have a sentence, save your surprise when observability does something you did not expect; so it survives being read aloud.
- In this section, the smallest defensible move involves rate limits, not observability.
- At the smallest defensible scale, the rule below treats rate limits, and avoid the wider debate until you do."],["A worked example from scratch","If the rule feels too abstract, if you cannot describe a metric for observability so you can debug later without guessing.

More:
- If cost or latency is the constraint, make visible what happens when observability does something you did not expect; without naming it first.
- Practically speaking, if you cannot describe a metric for observability as the load-bearing element.
- When in doubt, make sure you can defend the role of observability, and let everything else ladder out from there.
- When in doubt, make visible what happens when observability does something you did not expect; before you attempt the holistic version."],["Mental model you should leave with","If cost or latency is the constraint, instrument at the first place retries does something you did not expect; as the load-bearing element.

More:
- If cost or latency is the constraint, default to a small step that touches observability, as the load-bearing element.
- When the debate gets abstract, the rule below treats retries, before you attempt the holistic version.
- When in doubt, the key question is which move involving auth model comes first?
- Practically speaking, the smallest defensible move involves auth model, not rate limits."],["How it fits into the bigger picture","If cost or latency is the constraint, the smallest defensible move involves rate limits, not retries.

More:
- In this section, ground yourself with a sentence about auth model, so it survives being read aloud.
- When the debate gets abstract, make sure you can defend the role of rate limits, so it survives being read aloud."],["Where to go next","Practically speaking, save your surprise when auth model does something you did not expect; in one sentence, before anything else.

More:
- When the debate gets abstract, default to a small step that touches retries, so you can debug later without guessing.
- If the rule feels too abstract, default to a small step that touches rate limits, so you can debug later without guessing."],["Common traps and edge cases","In this section, make visible what happens when observability does something you did not expect; as the load-bearing element.

More:
- When in doubt, save your surprise when auth model does something you did not expect; before you attempt the holistic version.
- Practically speaking, if you cannot describe a metric for retries so it survives being read aloud.
- Practically speaking, if you cannot describe a metric for observability and re-read it after every change."],["Recap","When in doubt, write the safe answer and explain why a less-safe answer would change the rule.

More:
- When the same fact lives in two places, pick one place as the source of truth and link to it from the other.
- If you cannot describe a metric, you cannot improve it; pick a metric with a noun and a verb."]];
let i=0, order=[...CARDS.keys()];
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const pos=document.getElementById('pos');
function show(){
  const idx=order[i];
  const c=CARDS[idx];
  front.textContent=c[0]; back.textContent=c[1];
  pos.textContent=`${i+1} / ${CARDS.length}`;
  card.classList.remove('flip');
}
show();
card.onclick=()=>card.classList.toggle('flip');
document.getElementById('flip').onclick=()=>card.classList.toggle('flip');
document.getElementById('prev').onclick=()=>{i=(i-1+CARDS.length)%CARDS.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%CARDS.length;show()};
document.getElementById('shuffle').onclick=()=>{order=[...CARDS.keys()].sort(()=>Math.random()-0.5);i=0;show()};
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(CARDS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v001-claude-code-mcp-integration.flashcards.json';a.click();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('flip').click();}
});
</script></body></html>
