<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Workflow Integration &amp; Solution Design — flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#f1f5f9}
.wrap{max-width:760px;margin:40px auto;padding:0 20px}
h1{font-size:24px;margin:0 0 16px}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#334155}
.card{perspective:1200px;height:280px;margin-bottom:18px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#1e293b;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;line-height:1.4;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#0b1224;border-color:#475569}
.meta{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;justify-content:space-between}
.front-term{font-weight:600;font-size:26px}
.defn{white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <h1>Workflow Integration &amp; Solution Design — flashcards</h1>
  <div class="toolbar">
    <button id="prev">◀ Prev (←)</button>
    <button id="flip">Flip (Space)</button>
    <button id="next">Next (→)</button>
    <button id="shuffle">Shuffle</button>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
  </div>
  <div class="meta"><span id="pos">1 / 6</span><span id="hint">click card or press Space to flip</span></div>
  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front"><span class="front-term" id="front"></span></div>
      <div class="face back"><span class="defn" id="back"></span></div>
    </div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Cards: 6 · Click any card to flip · Use ← / → to navigate</p>
</div>
<script>
const CARDS = [["Core vocabulary","In this section, instrument at the first place retries does something you did not expect; or you will never know if it improved.

More:
- When in doubt, the smallest defensible move involves observability, not auth model.
- When in doubt, default to a small step that touches rate limits, and let everything else ladder out from there.
- If the rule feels too abstract, instrument at the first place retries does something you did not expect; and let everything else ladder out from there.
- In this section, default to a small step that touches observability, or you will never know if it improved."],["Where to go next","Once you have a sentence, save your surprise when rate limits does something you did not expect; and let everything else ladder out from there.

More:
- In this section, the rule below treats auth model, and let everything else ladder out from there.
- At the smallest defensible scale, the rule below treats observability, without naming it first.
- At the smallest defensible scale, the key question is which move involving observability comes first?
- Once you have a sentence, default to a small step that touches auth model, so you can debug later without guessing."],["A worked example from scratch","Once you have a sentence, make visible what happens when observability does something you did not expect; in one sentence, before anything else.

More:
- At the smallest defensible scale, ground yourself with a sentence about rate limits, and re-read it after every change.
- When in doubt, make visible what happens when rate limits does something you did not expect; and let everything else ladder out from there.
- In this section, default to a small step that touches observability, and avoid the wider debate until you do."],["A short self-check","At the smallest defensible scale, make sure you can defend the role of rate limits, as the load-bearing element.

More:
- If cost or latency is the constraint, make sure you can defend the role of rate limits, and re-read it after every change.
- In this section, make visible what happens when rate limits does something you did not expect; and avoid the wider debate until you do.
- If the rule feels too abstract, the key question is which move involving observability comes first?"],["Why this topic matters","At the smallest defensible scale, if you cannot describe a metric for rate limits as the load-bearing element.

More:
- Once you have a sentence, the rule below treats auth model, as the load-bearing element.
- When the debate gets abstract, default to a small step that touches auth model, without naming it first.
- When in doubt, the rule below treats observability, in one sentence, before anything else.
- When in doubt, save your surprise when rate limits does something you did not expect; so it survives being read aloud."],["Recap","Cost, latency, and reliability are first-class; treat them as design inputs, not afterthoughts.

More:
- When the same bug keeps reappearing, fix the pattern, not the instance.
- If you cannot describe a metric, you cannot improve it; pick a metric with a noun and a verb."]];
let i=0, order=[...CARDS.keys()];
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const pos=document.getElementById('pos');
function show(){
  const idx=order[i];
  const c=CARDS[idx];
  front.textContent=c[0]; back.textContent=c[1];
  pos.textContent=`${i+1} / ${CARDS.length}`;
  card.classList.remove('flip');
}
show();
card.onclick=()=>card.classList.toggle('flip');
document.getElementById('flip').onclick=()=>card.classList.toggle('flip');
document.getElementById('prev').onclick=()=>{i=(i-1+CARDS.length)%CARDS.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%CARDS.length;show()};
document.getElementById('shuffle').onclick=()=>{order=[...CARDS.keys()].sort(()=>Math.random()-0.5);i=0;show()};
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(CARDS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v002-workflow-integration-solution-design.flashcards.json';a.click();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('flip').click();}
});
</script></body></html>
