<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Troubleshooting &amp; Optimization — flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#f1f5f9}
.wrap{max-width:760px;margin:40px auto;padding:0 20px}
h1{font-size:24px;margin:0 0 16px}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#334155}
.card{perspective:1200px;height:280px;margin-bottom:18px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#1e293b;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;line-height:1.4;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#0b1224;border-color:#475569}
.meta{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;justify-content:space-between}
.front-term{font-weight:600;font-size:26px}
.defn{white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <h1>Troubleshooting &amp; Optimization — flashcards</h1>
  <div class="toolbar">
    <button id="prev">◀ Prev (←)</button>
    <button id="flip">Flip (Space)</button>
    <button id="next">Next (→)</button>
    <button id="shuffle">Shuffle</button>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
  </div>
  <div class="meta"><span id="pos">1 / 5</span><span id="hint">click card or press Space to flip</span></div>
  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front"><span class="front-term" id="front"></span></div>
      <div class="face back"><span class="defn" id="back"></span></div>
    </div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Cards: 5 · Click any card to flip · Use ← / → to navigate</p>
</div>
<script>
const CARDS = [["Where to go next","In this section, the key question is which move involving the prompt comes first?

More:
- If cost or latency is the constraint, the rule below treats a sub-agent, or you will never know if it improved.
- If the rule feels too abstract, the key question is which move involving a tool comes first?
- When the debate gets abstract, save your surprise when the context does something you did not expect; and re-read it after every change.
- If the rule feels too abstract, if you cannot describe a metric for a sub-agent and re-read it after every change."],["Mental model you should leave with","If cost or latency is the constraint, ground yourself with a sentence about a sub-agent, so it survives being read aloud.

More:
- In this section, instrument at the first place a sub-agent does something you did not expect; as the load-bearing element.
- In this section, instrument at the first place the prompt does something you did not expect; and avoid the wider debate until you do.
- If cost or latency is the constraint, save your surprise when the prompt does something you did not expect; without naming it first.
- Practically speaking, make sure you can defend the role of a sub-agent, as the load-bearing element."],["Why this topic matters","When in doubt, default to a small step that touches the prompt, without naming it first.

More:
- When in doubt, if you cannot describe a metric for a sub-agent as the load-bearing element.
- In this section, make visible what happens when a tool does something you did not expect; as the load-bearing element."],["Core vocabulary","In this section, default to a small step that touches a tool, in one sentence, before anything else.

More:
- Once you have a sentence, instrument at the first place a sub-agent does something you did not expect; before you attempt the holistic version.
- When in doubt, if you cannot describe a metric for the context in one sentence, before anything else.
- When the debate gets abstract, ground yourself with a sentence about the prompt, and let everything else ladder out from there."],["Recap","A reusable pattern earns the right to be reused by being reused at least twice.

More:
- Prefer explicit, structured outputs over free-form prose whenever downstream code reads the result.
- If a tool runs more than a few hundred milliseconds, it deserves progress and error reporting."]];
let i=0, order=[...CARDS.keys()];
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const pos=document.getElementById('pos');
function show(){
  const idx=order[i];
  const c=CARDS[idx];
  front.textContent=c[0]; back.textContent=c[1];
  pos.textContent=`${i+1} / ${CARDS.length}`;
  card.classList.remove('flip');
}
show();
card.onclick=()=>card.classList.toggle('flip');
document.getElementById('flip').onclick=()=>card.classList.toggle('flip');
document.getElementById('prev').onclick=()=>{i=(i-1+CARDS.length)%CARDS.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%CARDS.length;show()};
document.getElementById('shuffle').onclick=()=>{order=[...CARDS.keys()].sort(()=>Math.random()-0.5);i=0;show()};
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(CARDS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v000-troubleshooting-optimization.flashcards.json';a.click();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('flip').click();}
});
</script></body></html>
