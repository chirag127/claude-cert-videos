<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Prompting &amp; Task Execution — flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#f1f5f9}
.wrap{max-width:760px;margin:40px auto;padding:0 20px}
h1{font-size:24px;margin:0 0 16px}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#334155}
.card{perspective:1200px;height:280px;margin-bottom:18px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#1e293b;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;line-height:1.4;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#0b1224;border-color:#475569}
.meta{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;justify-content:space-between}
.front-term{font-weight:600;font-size:26px}
.defn{white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <h1>Prompting &amp; Task Execution — flashcards</h1>
  <div class="toolbar">
    <button id="prev">◀ Prev (←)</button>
    <button id="flip">Flip (Space)</button>
    <button id="next">Next (→)</button>
    <button id="shuffle">Shuffle</button>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
  </div>
  <div class="meta"><span id="pos">1 / 7</span><span id="hint">click card or press Space to flip</span></div>
  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front"><span class="front-term" id="front"></span></div>
      <div class="face back"><span class="defn" id="back"></span></div>
    </div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Cards: 7 · Click any card to flip · Use ← / → to navigate</p>
</div>
<script>
const CARDS = [["How it fits into the bigger picture","If the rule feels too abstract, ground yourself with a sentence about few-shot examples, as the load-bearing element.

More:
- At the smallest defensible scale, the key question is which move involving the system message comes first?
- Once you have a sentence, if you cannot describe a metric for few-shot examples so you can debug later without guessing."],["A short self-check","When the debate gets abstract, if you cannot describe a metric for few-shot examples before you attempt the holistic version.

More:
- When the debate gets abstract, make sure you can defend the role of few-shot examples, in one sentence, before anything else.
- When the debate gets abstract, save your surprise when the system message does something you did not expect; or you will never know if it improved.
- If the rule feels too abstract, make visible what happens when prompt does something you did not expect; so it survives being read aloud."],["A worked example from scratch","When in doubt, instrument at the first place the system message does something you did not expect; or you will never know if it improved.

More:
- In this section, default to a small step that touches the system message, and let everything else ladder out from there.
- Practically speaking, the smallest defensible move involves few-shot examples, not the system message.
- If cost or latency is the constraint, make sure you can defend the role of structured output, in one sentence, before anything else.
- If cost or latency is the constraint, default to a small step that touches the system message, as the load-bearing element."],["Why this topic matters","If cost or latency is the constraint, instrument at the first place prompt does something you did not expect; without naming it first.

More:
- When in doubt, the key question is which move involving structured output comes first?
- If cost or latency is the constraint, if you cannot describe a metric for few-shot examples so you can debug later without guessing."],["Mental model you should leave with","Once you have a sentence, the rule below treats prompt, or you will never know if it improved.

More:
- At the smallest defensible scale, the smallest defensible move involves structured output, not prompt.
- In this section, make visible what happens when prompt does something you did not expect; in one sentence, before anything else.
- At the smallest defensible scale, make sure you can defend the role of the system message, so you can debug later without guessing.
- When in doubt, the key question is which move involving prompt comes first?"],["Common traps and edge cases","At the smallest defensible scale, default to a small step that touches the system message, so it survives being read aloud.

More:
- When in doubt, the key question is which move involving the system message comes first?
- Practically speaking, save your surprise when structured output does something you did not expect; so it survives being read aloud.
- When in doubt, default to a small step that touches the system message, or you will never know if it improved."],["Recap","If you cannot describe a metric, you cannot improve it; pick a metric with a noun and a verb.

More:
- When the same bug keeps reappearing, fix the pattern, not the instance.
- Anything you cannot describe in one sentence is probably two or three things glued together."]];
let i=0, order=[...CARDS.keys()];
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const pos=document.getElementById('pos');
function show(){
  const idx=order[i];
  const c=CARDS[idx];
  front.textContent=c[0]; back.textContent=c[1];
  pos.textContent=`${i+1} / ${CARDS.length}`;
  card.classList.remove('flip');
}
show();
card.onclick=()=>card.classList.toggle('flip');
document.getElementById('flip').onclick=()=>card.classList.toggle('flip');
document.getElementById('prev').onclick=()=>{i=(i-1+CARDS.length)%CARDS.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%CARDS.length;show()};
document.getElementById('shuffle').onclick=()=>{order=[...CARDS.keys()].sort(()=>Math.random()-0.5);i=0;show()};
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(CARDS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v001-prompting-task-execution.flashcards.json';a.click();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('flip').click();}
});
</script></body></html>
