<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Claude Platform &amp; Model Foundations — flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#f1f5f9}
.wrap{max-width:760px;margin:40px auto;padding:0 20px}
h1{font-size:24px;margin:0 0 16px}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#334155}
.card{perspective:1200px;height:280px;margin-bottom:18px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#1e293b;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;line-height:1.4;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#0b1224;border-color:#475569}
.meta{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;justify-content:space-between}
.front-term{font-weight:600;font-size:26px}
.defn{white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <h1>Claude Platform &amp; Model Foundations — flashcards</h1>
  <div class="toolbar">
    <button id="prev">◀ Prev (←)</button>
    <button id="flip">Flip (Space)</button>
    <button id="next">Next (→)</button>
    <button id="shuffle">Shuffle</button>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
  </div>
  <div class="meta"><span id="pos">1 / 6</span><span id="hint">click card or press Space to flip</span></div>
  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front"><span class="front-term" id="front"></span></div>
      <div class="face back"><span class="defn" id="back"></span></div>
    </div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Cards: 6 · Click any card to flip · Use ← / → to navigate</p>
</div>
<script>
const CARDS = [["Mental model you should leave with","Once you have a sentence, save your surprise when the context window does something you did not expect; and let everything else ladder out from there.

More:
- If cost or latency is the constraint, default to a small step that touches latency tier, before you attempt the holistic version.
- At the smallest defensible scale, save your surprise when cost tier does something you did not expect; and avoid the wider debate until you do."],["Where to go next","Once you have a sentence, the key question is which move involving the context window comes first?

More:
- Practically speaking, the smallest defensible move involves cost tier, not model tier.
- When in doubt, make sure you can defend the role of model tier, in one sentence, before anything else.
- If cost or latency is the constraint, default to a small step that touches model tier, in one sentence, before anything else."],["A worked example from scratch","If the rule feels too abstract, ground yourself with a sentence about cost tier, and re-read it after every change.

More:
- In this section, ground yourself with a sentence about cost tier, in one sentence, before anything else.
- When the debate gets abstract, make visible what happens when latency tier does something you did not expect; and re-read it after every change.
- If cost or latency is the constraint, instrument at the first place model tier does something you did not expect; so it survives being read aloud.
- If cost or latency is the constraint, ground yourself with a sentence about model tier, or you will never know if it improved."],["Common traps and edge cases","When in doubt, make visible what happens when model tier does something you did not expect; and re-read it after every change.

More:
- If cost or latency is the constraint, the key question is which move involving latency tier comes first?
- When in doubt, make sure you can defend the role of model tier, or you will never know if it improved.
- If the rule feels too abstract, ground yourself with a sentence about latency tier, so it survives being read aloud."],["Why this topic matters","When the debate gets abstract, the smallest defensible move involves model tier, not latency tier.

More:
- If the rule feels too abstract, if you cannot describe a metric for latency tier and re-read it after every change.
- Once you have a sentence, instrument at the first place latency tier does something you did not expect; in one sentence, before anything else.
- At the smallest defensible scale, the rule below treats the context window, so you can debug later without guessing."],["Recap","Every auto-generated artefact should still be reviewable by a human in under a minute.

More:
- The cheapest possible evaluation beats a perfect evaluation that never runs.
- Trust boundaries belong at the network edge, the data edge, and the human review edge; not in the middle of a flow."]];
let i=0, order=[...CARDS.keys()];
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const pos=document.getElementById('pos');
function show(){
  const idx=order[i];
  const c=CARDS[idx];
  front.textContent=c[0]; back.textContent=c[1];
  pos.textContent=`${i+1} / ${CARDS.length}`;
  card.classList.remove('flip');
}
show();
card.onclick=()=>card.classList.toggle('flip');
document.getElementById('flip').onclick=()=>card.classList.toggle('flip');
document.getElementById('prev').onclick=()=>{i=(i-1+CARDS.length)%CARDS.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%CARDS.length;show()};
document.getElementById('shuffle').onclick=()=>{order=[...CARDS.keys()].sort(()=>Math.random()-0.5);i=0;show()};
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(CARDS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v002-platform-model-foundations.flashcards.json';a.click();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('flip').click();}
});
</script></body></html>
