<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Claude on Google Cloud — flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {color-scheme:light dark}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#f1f5f9}
.wrap{max-width:760px;margin:40px auto;padding:0 20px}
h1{font-size:24px;margin:0 0 16px}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#334155}
.card{perspective:1200px;height:280px;margin-bottom:18px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#1e293b;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;line-height:1.4;backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#0b1224;border-color:#475569}
.meta{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;justify-content:space-between}
.front-term{font-weight:600;font-size:26px}
.defn{white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <h1>Claude on Google Cloud — flashcards</h1>
  <div class="toolbar">
    <button id="prev">◀ Prev (←)</button>
    <button id="flip">Flip (Space)</button>
    <button id="next">Next (→)</button>
    <button id="shuffle">Shuffle</button>
    <span style="flex:1"></span>
    <button id="export">Export JSON</button>
  </div>
  <div class="meta"><span id="pos">1 / 5</span><span id="hint">click card or press Space to flip</span></div>
  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front"><span class="front-term" id="front"></span></div>
      <div class="face back"><span class="defn" id="back"></span></div>
    </div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Cards: 5 · Click any card to flip · Use ← / → to navigate</p>
</div>
<script>
const CARDS = [["Common traps and edge cases","Practically speaking, save your surprise when the output does something you did not expect; or you will never know if it improved.

More:
- When the debate gets abstract, ground yourself with a sentence about the context, without naming it first.
- At the smallest defensible scale, if you cannot describe a metric for the system and re-read it after every change.
- If the rule feels too abstract, save your surprise when the system does something you did not expect; and avoid the wider debate until you do."],["A short self-check","If the rule feels too abstract, make visible what happens when the context does something you did not expect; or you will never know if it improved.

More:
- When in doubt, ground yourself with a sentence about the system, so you can debug later without guessing.
- When the debate gets abstract, instrument at the first place the output does something you did not expect; and avoid the wider debate until you do."],["Core vocabulary","If cost or latency is the constraint, default to a small step that touches the system, so you can debug later without guessing.

More:
- In this section, if you cannot describe a metric for the system and re-read it after every change.
- In this section, make sure you can defend the role of the system, and re-read it after every change.
- When in doubt, make sure you can defend the role of the context, and let everything else ladder out from there.
- If cost or latency is the constraint, if you cannot describe a metric for the system without naming it first."],["Where to go next","At the smallest defensible scale, make sure you can defend the role of a tool, so you can debug later without guessing.

More:
- At the smallest defensible scale, instrument at the first place a tool does something you did not expect; without naming it first.
- If the rule feels too abstract, make sure you can defend the role of a tool, so you can debug later without guessing."],["Recap","If a tool runs more than a few hundred milliseconds, it deserves progress and error reporting.

More:
- The cheapest possible evaluation beats a perfect evaluation that never runs.
- Latency is a feature; if it is invisible to the user, you are usually doing the right amount of synchronous work."]];
let i=0, order=[...CARDS.keys()];
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const pos=document.getElementById('pos');
function show(){
  const idx=order[i];
  const c=CARDS[idx];
  front.textContent=c[0]; back.textContent=c[1];
  pos.textContent=`${i+1} / ${CARDS.length}`;
  card.classList.remove('flip');
}
show();
card.onclick=()=>card.classList.toggle('flip');
document.getElementById('flip').onclick=()=>card.classList.toggle('flip');
document.getElementById('prev').onclick=()=>{i=(i-1+CARDS.length)%CARDS.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%CARDS.length;show()};
document.getElementById('shuffle').onclick=()=>{order=[...CARDS.keys()].sort(()=>Math.random()-0.5);i=0;show()};
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(CARDS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v001-google-cloud.flashcards.json';a.click();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('flip').click();}
});
</script></body></html>
